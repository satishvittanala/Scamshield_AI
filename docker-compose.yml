version: '3.8'

services:
  scamshield-app:
    build: .
    container_name: scamshield_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./ml/saved_models:/app/ml/saved_models
      - ./scamshield.db:/app/scamshield.db
    env_file:
      - .env.example
    environment:
      - PROJECT_NAME=ScamShield AI
      - DATABASE_URL=sqlite:///./scamshield.db
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
